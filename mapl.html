<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location Map</title>

  <!-- Подключаем стили и JS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Инициализация карты (центр и зум — можно поменять)
    const map = L.map('map').setView([55.751244, 37.618423], 13); // Москва по умолчанию

    // Добавляем тайлы OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let marker = null;
    let circle = null;

    function updatePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      // Если маркер ещё не создан — создаём
      if (!marker) {
        marker = L.marker([lat, lng]).addTo(map);
        circle = L.circle([lat, lng], {
          radius: accuracy,
          color: '#ff0000',
          fillOpacity: 0.2
        }).addTo(map);
      } else {
        // Двигаем маркер и круг
        marker.setLatLng([lat, lng]);
        circle.setLatLng([lat, lng]);
        circle.setRadius(accuracy);
      }

      // Центрируем карту на позиции (опционально — можно убрать, если не хочется, чтобы камера «прыгала»)
      map.panTo([lat, lng]);
    }

    function handleError(error) {
      console.error('Ошибка геолокации:', error);
      // Тут можно вывести сообщение на экран, если нужно
    }

    // Запрос геолокации
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        updatePosition,
        handleError,
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    } else {
      alert('Геолокация не поддерживается в этом браузере');
    }
  </script>
</body>
</html>
